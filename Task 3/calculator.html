<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --body-gray:#3A3A3C;
    --body-dark:#2C2C2E;
    --screen:#C4D5B5;
    --screen-dark:#8FA37E;
    --digit:#233021;
    --key-num:#4C4C4E;
    --key-fn:#5E5E60;
    --key-op:#FF9F0A;
    --key-op-active:#FFB84D;
    --text:#F2F2F0;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:radial-gradient(circle at 30% 20%, #4A4A4C, #1E1E20 75%);
    font-family:'JetBrains Mono', monospace;
  }
  .calculator{
    width:320px;
    background:var(--body-gray);
    border-radius:26px;
    padding:22px;
    box-shadow:0 30px 70px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.08);
  }
  .screen{
    background:linear-gradient(160deg, var(--screen), var(--screen-dark));
    border-radius:14px;
    padding:26px 20px 18px;
    margin-bottom:20px;
    box-shadow:inset 0 3px 10px rgba(0,0,0,0.35);
    text-align:right;
    overflow:hidden;
  }
  .screen .history{
    min-height:18px;
    color:var(--digit);
    opacity:0.55;
    font-size:0.85rem;
    white-space:nowrap;
    overflow-x:auto;
  }
  .screen .display{
    color:var(--digit);
    font-size:2.4rem;
    font-weight:700;
    letter-spacing:0.01em;
    white-space:nowrap;
    overflow-x:auto;
    margin-top:4px;
  }
  .keys{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:12px;
  }
  button{
    border:none;
    border-radius:50%;
    aspect-ratio:1/1;
    font-family:'JetBrains Mono', monospace;
    font-size:1.25rem;
    font-weight:500;
    color:var(--text);
    background:var(--key-num);
    cursor:pointer;
    box-shadow:0 3px 0 rgba(0,0,0,0.25);
    transition:transform .05s ease, box-shadow .05s ease;
  }
  button:active{ transform:translateY(2px); box-shadow:0 1px 0 rgba(0,0,0,0.25); }
  button.fn{ background:var(--key-fn); }
  button.op{ background:var(--key-op); color:#2C1600; font-weight:700; }
  button.op.active{ background:var(--key-op-active); }
  button.zero{ grid-column:span 2; border-radius:34px; text-align:left; padding-left:26px; aspect-ratio:auto; }
  button.equals{ background:var(--key-op); color:#2C1600; }
</style>
</head>
<body>

<div class="calculator">
  <div class="screen">
    <div class="history" id="history">&nbsp;</div>
    <div class="display" id="display">0</div>
  </div>
  <div class="keys">
    <button class="fn" data-action="clear">AC</button>
    <button class="fn" data-action="negate">+/-</button>
    <button class="fn" data-action="percent">%</button>
    <button class="op" data-op="÷">÷</button>

    <button data-num="7">7</button>
    <button data-num="8">8</button>
    <button data-num="9">9</button>
    <button class="op" data-op="×">×</button>

    <button data-num="4">4</button>
    <button data-num="5">5</button>
    <button data-num="6">6</button>
    <button class="op" data-op="−">−</button>

    <button data-num="1">1</button>
    <button data-num="2">2</button>
    <button data-num="3">3</button>
    <button class="op" data-op="+">+</button>

    <button class="zero" data-num="0">0</button>
    <button data-action="decimal">.</button>
    <button class="equals" data-action="equals">=</button>
  </div>
</div>

<script>
  const display = document.getElementById('display');
  const historyEl = document.getElementById('history');

  let current = '0';
  let previous = null;
  let operator = null;
  let justEvaluated = false;

  function updateDisplay(){
    display.textContent = current;
  }

  function updateHistory(text){
    historyEl.textContent = text || '\u00A0';
  }

  function inputDigit(d){
    if (justEvaluated){
      current = d;
      justEvaluated = false;
    } else if (current === '0'){
      current = d;
    } else {
      current += d;
    }
    updateDisplay();
  }

  function inputDecimal(){
    if (justEvaluated){
      current = '0.';
      justEvaluated = false;
      updateDisplay();
      return;
    }
    if (!current.includes('.')) current += '.';
    updateDisplay();
  }

  function clearAll(){
    current = '0';
    previous = null;
    operator = null;
    justEvaluated = false;
    updateHistory('');
    updateDisplay();
  }

  function negate(){
    current = (parseFloat(current) * -1).toString();
    updateDisplay();
  }

  function percent(){
    current = (parseFloat(current) / 100).toString();
    updateDisplay();
  }

  function compute(a, b, op){
    a = parseFloat(a); b = parseFloat(b);
    switch(op){
      case '+': return a + b;
      case '−': return a - b;
      case '×': return a * b;
      case '÷': return b === 0 ? 'Error' : a / b;
      default: return b;
    }
  }

  function chooseOperator(op){
    if (operator && previous !== null && !justEvaluated){
      const result = compute(previous, current, operator);
      current = result.toString();
      previous = result;
    } else {
      previous = parseFloat(current);
    }
    operator = op;
    justEvaluated = false;
    updateHistory(`${previous} ${operator}`);
    current = '0';
    document.querySelectorAll('.op').forEach(b => b.classList.remove('active'));
    document.querySelector(`.op[data-op="${op}"]`).classList.add('active');
  }

  function equals(){
    if (operator === null || previous === null) return;
    const result = compute(previous, current, operator);
    updateHistory(`${previous} ${operator} ${current} =`);
    current = result.toString();
    previous = null;
    operator = null;
    justEvaluated = true;
    document.querySelectorAll('.op').forEach(b => b.classList.remove('active'));
    updateDisplay();
  }

  document.querySelectorAll('button').forEach(btn => {
    btn.addEventListener('click', () => {
      const num = btn.dataset.num;
      const op = btn.dataset.op;
      const action = btn.dataset.action;

      if (num !== undefined) inputDigit(num);
      else if (op !== undefined) chooseOperator(op);
      else if (action === 'clear') clearAll();
      else if (action === 'negate') negate();
      else if (action === 'percent') percent();
      else if (action === 'decimal') inputDecimal();
      else if (action === 'equals') equals();
    });
  });

  document.addEventListener('keydown', (e) => {
    if (e.key >= '0' && e.key <= '9') inputDigit(e.key);
    else if (e.key === '.') inputDecimal();
    else if (e.key === '+') chooseOperator('+');
    else if (e.key === '-') chooseOperator('−');
    else if (e.key === '*') chooseOperator('×');
    else if (e.key === '/') { e.preventDefault(); chooseOperator('÷'); }
    else if (e.key === 'Enter' || e.key === '=') equals();
    else if (e.key === 'Escape') clearAll();
    else if (e.key === 'Backspace'){
      current = current.length > 1 ? current.slice(0, -1) : '0';
      updateDisplay();
    }
  });
</script>

</body>
</html>
